<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDA Nethravathi | Parking Allotment Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#eef1f6; --bg2:#e4e9f2;
  --card:rgba(255,255,255,0.62); --card-solid:#ffffff;
  --card-border:rgba(255,255,255,0.9);
  --text:#1c2333; --text-dim:#5b6478; --text-faint:#8791a3;
  --accent:#1f4e8c; --accent2:#2f6fca;
  --seal:#c1541c; /* dark orange, matches existing suite */
  --seal-dim:#e07a3f;
  --good:#1f8a55; --good-bg:#e4f6ec;
  --warn:#b8790f; --warn-bg:#fbf0dc;
  --bad:#c23b3b; --bad-bg:#fbe6e6;
  --wait:#6b6f8a; --wait-bg:#e9eaf3;
  --accent-bg:#dbe7fb;
  --stage1:#a87b00; --stage1-bg:#fff2b8;
  --stage2:#c1541c; --stage2-bg:#ffdcb8;
  --stage3:#1f4e8c; --stage3-bg:#c9ddfb;
  --stage4:#6b3fa0; --stage4-bg:#e2d2f9;
  --stage5:#1f8a55; --stage5-bg:#bdf0d4;
  --shadow: 0 8px 30px rgba(31,42,74,0.10);
  --shadow-lg: 0 20px 60px rgba(31,42,74,0.18);
  --radius: 14px;
  --font-display:'Fraunces','Georgia',serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
[data-theme="dark"]{
  --bg:#090c12; --bg2:#0f141d;
  --card:rgba(19,25,36,0.72); --card-solid:#131a26;
  --card-border:rgba(255,255,255,0.075);
  --text:#f1f4fa; --text-dim:#98a2ba; --text-faint:#5e6a83;
  --accent:#4d84e0; --accent2:#6fa0f2;
  --seal:#c8813f; /* brass — official seal / civic registry accent */
  --seal-dim:#e0a768;
  --good:#35d689; --good-bg:rgba(53,214,137,0.14);
  --warn:#eab04a; --warn-bg:rgba(234,176,74,0.14);
  --bad:#f2685f; --bad-bg:rgba(242,104,95,0.14);
  --wait:#8891ab; --wait-bg:rgba(136,145,171,0.13);
  --accent-bg:rgba(77,132,224,0.16);
  --stage1:#eecf5c; --stage1-bg:rgba(238,207,92,0.20);
  --stage2:#e0a25a; --stage2-bg:rgba(224,162,90,0.20);
  --stage3:#4d84e0; --stage3-bg:rgba(77,132,224,0.20);
  --stage4:#b48af0; --stage4-bg:rgba(180,138,240,0.22);
  --stage5:#35d689; --stage5-bg:rgba(53,214,137,0.20);
  --shadow: 0 10px 34px rgba(0,0,0,0.45);
  --shadow-lg: 0 26px 74px rgba(0,0,0,0.62);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(1100px 500px at 8% -8%, rgba(47,111,202,0.14), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(193,84,28,0.10), transparent 55%),
    linear-gradient(180deg, var(--bg), var(--bg2));
  color:var(--text);
  min-height:100vh;
  transition:background .3s ease, color .3s ease;
}
[data-theme="dark"] body{
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.022) 0px, rgba(255,255,255,0.022) 1px, transparent 1px, transparent 64px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.022) 0px, rgba(255,255,255,0.022) 1px, transparent 1px, transparent 64px),
    radial-gradient(1200px 560px at 8% -10%, rgba(77,132,224,0.16), transparent 60%),
    radial-gradient(900px 520px at 100% 0%, rgba(200,129,63,0.12), transparent 55%),
    linear-gradient(180deg, var(--bg), var(--bg2));
}
::selection{ background:var(--accent2); color:#fff; }
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ============ LAYOUT ============ */
.wrap{ max-width:1180px; margin:0 auto; padding:0 20px 80px; }
header.top{
  position:sticky; top:0; z-index:40;
  backdrop-filter: blur(16px) saturate(140%);
  background:var(--card);
  border-bottom:1px solid var(--card-border);
}
[data-theme="dark"] header.top{
  border-bottom:1px solid rgba(200,129,63,0.22);
  box-shadow:0 1px 0 rgba(200,129,63,0.06);
}
.top-inner{
  max-width:1180px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
}
.brand{ display:flex; align-items:center; gap:12px; }
.brand-seal{ width:42px; height:42px; flex-shrink:0; }
.brand-text .t1{ font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:.2px; }
.brand-text .t2{ font-size:11.5px; color:var(--text-dim); letter-spacing:.3px; }
.top-actions{ display:flex; align-items:center; gap:8px; }
.icon-btn{
  width:38px; height:38px; border-radius:11px; border:1px solid var(--card-border);
  background:var(--card-solid); display:flex; align-items:center; justify-content:center;
  color:var(--text-dim); transition:.15s;
}
.icon-btn:hover{ color:var(--accent2); transform:translateY(-1px); }
.btn{
  border:none; border-radius:11px; padding:10px 18px; font-weight:600; font-size:13.5px;
  display:inline-flex; align-items:center; gap:8px; transition:.15s; letter-spacing:.2px;
}
.btn-primary{ background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#fff; box-shadow:0 6px 18px rgba(47,111,202,0.35);}
.btn-primary:hover{ transform:translateY(-1px); box-shadow:0 10px 24px rgba(47,111,202,0.45); }
.btn-seal{ background:linear-gradient(135deg,var(--seal-dim),var(--seal)); color:#fff; box-shadow:0 6px 18px rgba(193,84,28,0.35);}
.btn-seal:hover{ transform:translateY(-1px); }
.btn-ghost{ background:var(--card-solid); color:var(--text); border:1px solid var(--card-border); }
.btn-ghost:hover{ border-color:var(--accent2); color:var(--accent2); }
.btn-danger{ background:var(--bad-bg); color:var(--bad); }
.btn-danger:hover{ filter:brightness(0.95); }
.btn-sm{ padding:7px 12px; font-size:12.5px; border-radius:9px;}
.btn:disabled{ opacity:.45; cursor:not-allowed; transform:none !important; }
[data-theme="dark"] .btn-primary{ box-shadow:0 6px 20px rgba(77,132,224,0.28); }
[data-theme="dark"] .btn-primary:hover{ box-shadow:0 10px 26px rgba(77,132,224,0.38); }
[data-theme="dark"] .btn-seal{ box-shadow:0 6px 20px rgba(200,129,63,0.3); }
[data-theme="dark"] .btn-seal:hover{ box-shadow:0 10px 26px rgba(200,129,63,0.4); }

/* ============ NAV PILLS ============ */
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin:26px 0 22px; }
.tab{
  padding:9px 16px; border-radius:999px; font-size:13px; font-weight:600;
  background:var(--card-solid); border:1px solid var(--card-border); color:var(--text-dim);
}
.tab.active{ background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#fff; border-color:transparent; }

/* ============ HERO ============ */
.hero{
  margin-top:30px; border-radius:22px; padding:44px 38px;
  background:linear-gradient(120deg, rgba(47,111,202,0.13), rgba(193,84,28,0.09));
  border:1px solid var(--card-border);
  display:grid; grid-template-columns:1.3fr 1fr; gap:28px; align-items:center;
  position:relative; overflow:hidden;
}
[data-theme="dark"] .hero{
  background:linear-gradient(120deg, rgba(77,132,224,0.16), rgba(200,129,63,0.12));
}
.hero::before{
  content:""; position:absolute; right:-60px; top:-60px; width:260px; height:260px; border-radius:50%;
  background:radial-gradient(circle, rgba(193,84,28,0.18), transparent 70%);
}
.eyebrow{ font-size:11.5px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; color:var(--seal); margin-bottom:10px; }
.hero h1{ font-family:var(--font-display); font-size:clamp(26px,4vw,38px); font-weight:700; line-height:1.15; letter-spacing:-.3px; }
.hero p{ margin-top:12px; color:var(--text-dim); font-size:15px; max-width:44ch; line-height:1.6; }
.hero .cta-row{ display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; }
.permit-card{
  background:var(--card-solid); border:1px solid var(--card-border); border-radius:18px;
  box-shadow:var(--shadow-lg); padding:0; position:relative; overflow:hidden;
}
.permit-top{ padding:20px 22px 16px; display:flex; justify-content:space-between; align-items:flex-start; }
.permit-top .lbl{ font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-faint); font-weight:700;}
.permit-top .val{ font-family:var(--font-mono); font-size:15px; font-weight:600; margin-top:3px;}
.permit-mid{ position:relative; padding:14px 22px 20px; border-top:2px dashed var(--card-border); }
.permit-mid::before,.permit-mid::after{
  content:""; position:absolute; top:-10px; width:20px; height:20px; border-radius:50%; background:var(--bg2);
}
[data-theme="dark"] .permit-mid::before,[data-theme="dark"] .permit-mid::after{ background:var(--bg); }
.permit-mid::before{ left:-10px; } .permit-mid::after{ right:-10px; }
.permit-row{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-dim); padding:5px 0;}
.permit-row b{ color:var(--text); font-weight:600;}
.permit-status{ display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; font-size:11.5px; font-weight:700; }

/* ============ CARDS / GRID ============ */
.grid{ display:grid; gap:18px; }
.grid-2{ grid-template-columns:repeat(2,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-4{ grid-template-columns:repeat(4,1fr); }
.grid-5{ grid-template-columns:repeat(5,1fr); }
.card{
  background:var(--card); backdrop-filter: blur(14px) saturate(140%);
  border:1px solid var(--card-border); border-radius:var(--radius); padding:22px;
  box-shadow:var(--shadow);
}
.card h3{ font-family:var(--font-display); font-size:16px; font-weight:600; margin-bottom:4px;}
.card .sub{ font-size:12.5px; color:var(--text-dim); margin-bottom:16px;}
.stat-card{ text-align:left; }
.stat-card .num{ font-family:var(--font-display); font-size:30px; font-weight:700; margin-top:2px;}
.stat-card .lbl{ font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.8px; font-weight:600;}
.stage-card{
  backdrop-filter:none !important; -webkit-backdrop-filter:none !important;
  border:1px solid transparent; border-left:5px solid var(--stage-color);
  background:var(--stage-bg) !important;
}
.stage-card h3{ color:var(--stage-color); }

/* ============ FORMS ============ */
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:6px; letter-spacing:.2px;}
.field input, .field select, .field textarea{
  width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--card-border);
  background:var(--card-solid); color:var(--text); font-size:14px; transition:.15s;
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; border-color:var(--accent2); box-shadow:0 0 0 3px rgba(47,111,202,0.15);
}
.field textarea{ resize:vertical; min-height:70px; }
.field .hint{ font-size:11px; color:var(--text-faint); margin-top:5px; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
fieldset.vehicle-block{
  border:1px solid var(--card-border); border-radius:12px; padding:16px; margin-bottom:14px;
  position:relative; background:rgba(127,127,127,0.04);
}
fieldset.vehicle-block legend{ font-size:12px; font-weight:700; color:var(--accent2); padding:0 8px;}
.remove-vehicle{
  position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:8px;
  background:var(--bad-bg); color:var(--bad); border:none; font-size:14px; line-height:1;
}
.upload-drop{
  border:1.5px dashed var(--card-border); border-radius:12px; padding:18px; text-align:center;
  color:var(--text-dim); font-size:13px; cursor:pointer; transition:.15s;
}
.upload-drop:hover{ border-color:var(--accent2); color:var(--accent2); }
.doc-chip{
  display:inline-flex; align-items:center; gap:8px; background:var(--card-solid); border:1px solid var(--card-border);
  padding:6px 10px; border-radius:9px; font-size:12px; margin:5px 6px 0 0;
}
.doc-chip button{ background:none; border:none; color:var(--bad); font-size:13px; }

/* ============ TABLE / LIST ============ */
.list{ display:flex; flex-direction:column; gap:12px; }
.req-row{
  background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:16px 18px;
  display:grid; grid-template-columns:auto 1.4fr 1fr 1fr auto; gap:16px; align-items:center;
  box-shadow:var(--shadow);
}
.seniority-badge{
  width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--accent2),var(--accent));
  color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family:var(--font-mono);
  flex-shrink:0;
}
.req-name{ font-weight:700; font-size:14.5px; }
.req-sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
.ref-mono{ font-family:var(--font-mono); font-size:12px; color:var(--accent2); font-weight:600;}
.badge{
  display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:999px; font-size:11.5px; font-weight:700; letter-spacing:.2px;
}
.badge-pending{ background:var(--wait-bg); color:var(--wait); }
.badge-secretary{ background:var(--warn-bg); color:var(--warn); }
.badge-legal{ background:var(--warn-bg); color:var(--warn); }
.badge-allotted{ background:#dbe7fb; color:var(--accent); }
[data-theme="dark"] .badge-allotted{ background:rgba(91,155,240,0.15); }
.badge-confirmed{ background:var(--good-bg); color:var(--good); }
.badge-rejected{ background:var(--bad-bg); color:var(--bad); }
.row-actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;}

/* ============ SEAL ============ */
.seal-stamp{ width:74px; height:74px; }
.seal-inline{ display:flex; align-items:center; gap:10px; }
.seal-caption{ font-size:11px; color:var(--text-dim); line-height:1.4; }
.seal-caption b{ display:block; color:var(--seal); font-size:12px; }

/* ============ MODAL ============ */
.modal-bg{
  position:fixed; inset:0; background:rgba(10,14,24,0.55); backdrop-filter:blur(4px);
  display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal-bg.show{ display:flex; }
.modal{
  background:var(--card-solid); border-radius:20px; max-width:560px; width:100%;
  max-height:88vh; overflow-y:auto; padding:28px; box-shadow:var(--shadow-lg); border:1px solid var(--card-border);
}
.modal h2{ font-family:var(--font-display); font-size:19px; margin-bottom:4px; }
.modal .sub{ font-size:12.5px; color:var(--text-dim); margin-bottom:20px; }
.modal-close{ float:right; background:none; border:none; font-size:20px; color:var(--text-faint); }
.split-choice{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
.split-btn{
  border:1px solid var(--card-border); border-radius:14px; padding:18px 14px; text-align:center; background:var(--card);
}
.split-btn:hover{ border-color:var(--accent2); }
.split-btn .ic{ font-size:24px; margin-bottom:8px; display:block; }
.split-btn .t{ font-weight:700; font-size:14px; }
.split-btn .s{ font-size:11px; color:var(--text-dim); margin-top:3px;}

/* ============ MISC ============ */
.empty-state{ text-align:center; padding:50px 20px; color:var(--text-dim); }
.empty-state .ic{ font-size:36px; margin-bottom:10px; }
.toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--card-solid); border:1px solid var(--card-border); border-radius:12px; padding:13px 18px;
  box-shadow:var(--shadow-lg); font-size:13.5px; font-weight:500; display:flex; align-items:center; gap:10px;
  animation:slideIn .25s ease; max-width:320px;
}
.toast.ok{ border-left:4px solid var(--good); }
.toast.err{ border-left:4px solid var(--bad); }
@keyframes slideIn{ from{ transform:translateX(30px); opacity:0;} to{ transform:translateX(0); opacity:1;} }
.section-title{ font-family:var(--font-display); font-size:20px; font-weight:700; margin:34px 0 4px; letter-spacing:-.2px; }
[data-theme="dark"] .section-title{ position:relative; padding-bottom:10px; }
[data-theme="dark"] .section-title::after{ content:""; position:absolute; left:0; bottom:0; width:38px; height:2px; background:linear-gradient(90deg, var(--seal), transparent); }
.section-desc{ font-size:13px; color:var(--text-dim); margin-bottom:18px; }
.divider{ height:1px; background:var(--card-border); margin:22px 0; }
.timeline{ display:flex; align-items:center; gap:0; margin:18px 0; }
.tl-step{ flex:1; text-align:center; position:relative; }
.tl-dot{ width:30px; height:30px; border-radius:50%; margin:0 auto 6px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; background:var(--wait-bg); color:var(--wait); border:2px solid transparent;}
.tl-step.done .tl-dot{ background:var(--dot-color, var(--good)); color:#fff; }
.tl-step.current .tl-dot{ background:var(--dot-color, var(--warn)); color:#fff; box-shadow:0 0 0 4px var(--dot-bg, var(--warn-bg)); }
.tl-step.rejected .tl-dot{ background:var(--bad); color:#fff; }
.tl-line{ position:absolute; top:15px; left:-50%; width:100%; height:2px; background:var(--card-border); z-index:-1;}
.tl-step:first-child .tl-line{ display:none; }
.tl-step.done .tl-line{ background:var(--dot-color, var(--good)); }
.tl-label{ font-size:10.5px; font-weight:600; color:var(--text-dim); }
.tl-step.done .tl-label, .tl-step.current .tl-label{ color:var(--dot-color, var(--text)); }
.tl-time{ font-size:9.5px; color:var(--text-faint); margin-top:2px;}
.config-banner{
  background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:12px 16px; font-size:12.5px; margin-bottom:18px;
  border:1px solid rgba(184,121,15,0.25);
}
.loader{ display:inline-block; width:16px; height:16px; border:2.5px solid rgba(127,127,127,0.3); border-top-color:var(--accent2); border-radius:50%; animation:spin .7s linear infinite;}
@keyframes spin{ to{ transform:rotate(360deg);} }
.footer-note{ text-align:center; margin-top:50px; font-size:11.5px; color:var(--text-faint); }
@media (max-width:860px){
  .hero{ grid-template-columns:1fr; padding:30px 22px; }
  .grid-2,.grid-3,.grid-4,.grid-5{ grid-template-columns:1fr; }
  .req-row{ grid-template-columns:1fr; text-align:left; }
  .row-actions{ justify-content:flex-start; }
  .row2,.row3{ grid-template-columns:1fr; }
}/* ============ CERTIFICATE ============ */
.certificate{
  background:#fdfcf9; color:#1c2333; border:10px solid #1f4e8c; border-radius:4px;
  padding:40px 46px; position:relative; font-family:var(--font-body); max-width:720px; margin:0 auto;
}
.certificate::before{
  content:""; position:absolute; inset:10px; border:1.5px solid #c1541c; border-radius:2px; pointer-events:none;
}
.cert-head{ text-align:center; margin-bottom:20px; }
.cert-head .cert-seal-top{ width:64px; height:64px; margin:0 auto 8px; }
.cert-head .cert-org{ font-family:var(--font-display); font-weight:700; font-size:18px; color:#1f4e8c; letter-spacing:.3px;}
.cert-head .cert-sub{ font-size:11px; color:#5b6478; margin-top:2px; }
.cert-head .cert-title{ font-family:var(--font-display); font-weight:700; font-size:22px; color:#c1541c; margin-top:16px; letter-spacing:1px; text-transform:uppercase;}
.cert-ref{ text-align:center; font-family:var(--font-mono); font-size:12px; color:#5b6478; margin-top:4px; }
.cert-body{ margin-top:26px; font-size:13.5px; line-height:2.1; color:#1c2333; }
.cert-body .cert-row{ display:flex; justify-content:space-between; border-bottom:1px dotted #c8ccd6; padding:4px 0; }
.cert-body .cert-row span:first-child{ color:#5b6478; }
.cert-body .cert-row span:last-child{ font-weight:700; }
.cert-slot-highlight{
  text-align:center; margin:24px 0; padding:16px; border:2px dashed #c1541c; border-radius:10px; background:#fbf0dc;
}
.cert-slot-highlight .lbl{ font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:#c1541c; font-weight:700;}
.cert-slot-highlight .val{ font-family:var(--font-mono); font-size:26px; font-weight:700; color:#1c2333; margin-top:4px;}
.cert-foot{ display:flex; justify-content:space-between; align-items:flex-end; margin-top:36px; }

/* ---------- 2. DB HELPERS ---------- */
async function tursoBatch(statements){
  if(!CONFIGURED){ throw new Error("Turso not configured yet. Open the script and set TURSO_URL / TURSO_TOKEN."); }
  const body = { requests: [
    ...statements.map(s => ({ type:"execute", stmt: typeof s === "string" ? { sql:s } : s })),
    { type:"close" }
  ]};
  const res = await fetch(TURSO_URL, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":`Bearer ${TURSO_TOKEN}` },
    body: JSON.stringify(body)
  });
  if(!res.ok){ throw new Error("Turso error " + res.status); }
  const data = await res.json();
  return data.results.map(r => r.type === "ok" ? r.response.result : null);
}
function rowsToObjects(result){
  if(!result || !result.cols) return [];
  const cols = result.cols.map(c=>c.name);
  return (result.rows||[]).map(row=>{
    const obj = {};
    row.forEach((cell,i)=>{
      if(!cell || cell.type === "null"){ obj[cols[i]] = null; }
      else if(cell.type === "integer" || cell.type === "float"){ obj[cols[i]] = Number(cell.value); } // Turso returns these as strings — coerce so id comparisons (===) work
      else{ obj[cols[i]] = cell.value; }
    });
    return obj;
  });
}
function sqlVal(v){
  if(v === null || v === undefined) return { type:"null" };
  if(typeof v === "number") return Number.isInteger(v) ? { type:"integer", value:String(v) } : { type:"float", value:v };
  return { type:"text", value:String(v) };
}
function stmt(sql, args=[]){ return { sql, args: args.map(sqlVal) }; }

async function initSchema(){
  await tursoBatch([
    `CREATE TABLE IF NOT EXISTS parking_users (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      username TEXT UNIQUE, password_hash TEXT, role TEXT, full_name TEXT, created_at TEXT, last_login_at TEXT,
      is_active INTEGER DEFAULT 1
    )`,
    `CREATE TABLE IF NOT EXISTS parking_requests (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      reference_number TEXT UNIQUE,
      name TEXT, block TEXT, flat_number TEXT, contact_number TEXT, requestee_type TEXT DEFAULT 'owner',
      num_vehicles INTEGER, vehicles_json TEXT, documents_json TEXT, notes TEXT,
      status TEXT DEFAULT 'pending',
      allotted_slot TEXT, allotted_by TEXT, allotted_at TEXT,
      secretary_approved_by TEXT, secretary_approved_at TEXT, secretary_remarks TEXT,
      legal_approved_by TEXT, legal_approved_at TEXT, legal_remarks TEXT,
      president_approved_by TEXT, president_approved_at TEXT, president_remarks TEXT, seal_date TEXT, seal_valid_until TEXT,
      renewal_count INTEGER DEFAULT 0, renewal_pending INTEGER DEFAULT 0,
      renewal_period_value INTEGER, renewal_period_unit TEXT,
      renewal_proposed_by TEXT, renewal_proposed_at TEXT, renewal_notes TEXT, renewal_history_json TEXT,
      rejected_by TEXT, rejected_at TEXT, rejection_reason TEXT, rejected_stage TEXT,
      created_at TEXT, updated_at TEXT
    )`,
    `CREATE TABLE IF NOT EXISTS parking_access_log (
      id INTEGER PRIMARY KEY AUTOINCREMENT, username TEXT, action TEXT, details TEXT, timestamp TEXT
    )`,
    `CREATE TABLE IF NOT EXISTS parking_settings (
      key TEXT PRIMARY KEY, value TEXT
    )`
  ]);
  // Safe migrations for databases created before these columns existed
  try{ await tursoBatch([`ALTER TABLE parking_requests ADD COLUMN seal_valid_until TEXT`]); }catch(e){}
  try{ await tursoBatch([`ALTER TABLE parking_requests ADD COLUMN requestee_type TEXT DEFAULT 'owner'`]); }catch(e){}
  try{ await tursoBatch([`ALTER TABLE parking_requests ADD COLUMN renewal_count INTEGER DEFAULT 0`]); }catch(e){}
  try{ await tursoBatch([`ALTER TABLE parking_requests ADD COLUMN renewal_pending INTEGER DEFAULT 0`]); }catch(e){}
  try{ await tursoBatch([`ALTER TABLE parking_requests ADD COLUMN renewal_period_value INTEGER`]); }catch(e){}
  try{ await tursoBatch([`ALTER TABLE parking_requests ADD COLUMN renewal_period_unit TEXT`]); }catch(e){}
  try{ await tursoBatch([`ALTER TABLE parking_requests ADD COLUMN renewal_proposed_by TEXT`]); }catch(e){}
  try{ await tursoBatch([`ALTER TABLE parking_requests ADD COLUMN renewal_proposed_at TEXT`]); }catch(e){}
  try{ await tursoBatch([`ALTER TABLE parking_requests ADD COLUMN renewal_notes TEXT`]); }catch(e){}
  try{ await tursoBatch([`ALTER TABLE parking_requests ADD COLUMN renewal_history_json TEXT`]); }catch(e){}
  try{ await tursoBatch([`ALTER TABLE parking_users ADD COLUMN last_login_at TEXT`]); }catch(e){}
  try{ await tursoBatch([`ALTER TABLE parking_users ADD COLUMN is_active INTEGER DEFAULT 1`]); }catch(e){}
}

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function nowISO(){ return new Date().toISOString(); }
function addMonths(isoDate, months){
  const d = new Date(isoDate);
  d.setMonth(d.getMonth() + months);
  return d.toISOString();
}
function addPeriod(isoDate, value, unit){
  const d = new Date(isoDate);
  value = Number(value) || 0;
  if(unit === 'days') d.setDate(d.getDate() + value);
  else if(unit === 'years') d.setFullYear(d.getFullYear() + value);
  else d.setMonth(d.getMonth() + value); // default: months
  return d.toISOString();
}

/* ---------- SETTINGS (default validity period) ---------- */
let settingsCache = { validity_value: 6, validity_unit: 'months' }; // sensible default until loaded from DB
async function loadSettings(){
  try{
    const [res] = await tursoBatch([stmt(`SELECT key, value FROM parking_settings`)]);
    rowsToObjects(res).forEach(r=>{
      if(r.key === 'validity_value') settingsCache.validity_value = Number(r.value) || 6;
      if(r.key === 'validity_unit') settingsCache.validity_unit = r.value || 'months';
    });
  }catch(e){ /* keep defaults if settings table isn't reachable yet */ }
}
async function saveSetting(key, value){
  await tursoBatch([stmt(
    `INSERT INTO parking_settings (key, value) VALUES (?, ?) ON CONFLICT(key) DO UPDATE SET value=excluded.value`,
    [key, String(value)]
  )]);
}

function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return "—"; const d=new Date(iso); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+" · "+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
function genId(){ return Math.random().toString(36).slice(2,9); }

function toast(msg, ok=true){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (ok?'ok':'err');
  el.innerHTML = (ok?'✅ ':'⚠️ ') + msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(()=>el.remove(),300); }, 3800);
}
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
window.addEventListener('error', (e)=>{
  console.error(e.error || e.message);
  toast('Something went wrong: ' + (e.error ? e.error.message : e.message), false);
});

function applyTheme(t){
  document.body.setAttribute('data-theme', t);
  document.getElementById('themeToggle').textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('pk_theme', t);
}

  applyTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
};

/* ---------- 5. NAV / TABS ---------- */
function tabsForSession(){
  const t = [{id:'home', label:'Home'}, {id:'request', label:'New Request'}, {id:'status', label:'Track Status'}];
  if(session){
    if(session.role==='admin'||session.role==='superadmin') t.push({id:'admin', label:'Admin Queue'});
    if(session.role==='secretary') t.push({id:'secretary', label:'Secretary Review'});
    if(session.role==='legal') t.push({id:'legal', label:'Legal & Law Review'});
    if(session.role==='president') t.push({id:'president', label:'President — Final Seal'});
    t.push({id:'renewal', label:'Renewal'});
    t.push({id:'log', label:'Access Log'});
  }
  return t;
}
function renderTabs(){
  const nav = document.getElementById('mainTabs');
  nav.innerHTML = tabsForSession().map(t=>
    `<button class="tab ${currentTab===t.id?'active':''}" onclick="setTab('${t.id}')">${t.label}</button>`
  ).join('');
}
function setTab(id){ currentTab = id; renderTabs(); render(); }

async function doLogin(){
  const u = document.getElementById('li_user').value.trim();
  const p = document.getElementById('li_pass').value;
  if(!u||!p) return toast('Enter username and password', false);
  try{
    const hash = await sha256(p);
    const [res] = await tursoBatch([stmt(`SELECT * FROM parking_users WHERE username=?`,[u])]);
    const rows = rowsToObjects(res);
    if(rows.length===0 || rows[0].password_hash !== hash){ return toast('Invalid credentials', false); }
    if(Number(rows[0].is_active) === 0){ return toast('This account has been disabled. Contact an admin.', false); }
    session = { username: rows[0].username, role: rows[0].role, full_name: rows[0].full_name };
    localStorage.setItem('pk_session', JSON.stringify(session));
    await tursoBatch([stmt(`UPDATE parking_users SET last_login_at=? WHERE username=?`,[nowISO(), u])]);
    await logAccess(u, 'login', `role=${rows[0].role}`);
    closeModal('loginModalBg');
    renderTabs(); renderSessionBadge();
    setTab(rows[0].role==='secretary'?'secretary':rows[0].role==='legal'?'legal':rows[0].role==='president'?'president':'admin');
    toast(`Welcome, ${rows[0].full_name}`);
  }catch(e){ toast(e.message, false); }
}

async function submitFirstRun(){

  const statements = [];

/* ---------- 9. DATA HELPERS ---------- */
async function loadRequests(){
  const [res] = await tursoBatch([stmt(`SELECT * FROM parking_requests ORDER BY created_at ASC`)]);
  allRequests = rowsToObjects(res).map(r=>({
    ...r,
    status: (r.status || 'pending').trim(),
    vehicles: safeParseJSON(r.vehicles_json),
    documents: safeParseJSON(r.documents_json),
    renewal_history: safeParseJSON(r.renewal_history_json)
  }));
  return allRequests;
}
function safeParseJSON(str){
  if(!str) return [];
  try{ const v = JSON.parse(str); return Array.isArray(v) ? v : []; }catch(e){ return []; }
}
function seniorityRank(list){
  // rank by created_at ascending among list passed in
  const sorted = [...list].sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
  const map = {};
  sorted.forEach((r,i)=> map[r.id] = i+1);
  return map;
}
async function nextReferenceNumber(){
  const year = new Date().getFullYear();
  const [res] = await tursoBatch([stmt(`SELECT COUNT(*) as c FROM parking_requests WHERE reference_number LIKE ?`,[`PK-${year}-%`])]);
  const rows = rowsToObjects(res);
  const seq = (Number(rows[0]?.c || 0) + 1).toString().padStart(4,'0');
  return `PK-${year}-${seq}`;
}
function statusBadge(r){
  if(r.status === 'rejected') return `<span class="badge badge-rejected">✕ Rejected (${r.rejected_stage||''})</span>`;
  if(r.status === 'confirmed') return `<span class="badge badge-confirmed">✔ Confirmed & Sealed</span>`;
  if(r.status === 'allotted') return `<span class="badge badge-allotted">🅿 Slot Allotted — Pending Seal</span>`;
  if(r.status === 'legal_approved') return `<span class="badge badge-legal">⚖ Legal Cleared</span>`;
  if(r.status === 'secretary_approved') return `<span class="badge badge-secretary">📋 Secretary Approved</span>`;
  return `<span class="badge badge-pending">⏳ Pending Review</span>`;
}

let _flatCheckToken = 0;
async function checkFlatExisting(){
  const block = document.getElementById('f_block')?.value;
  const flat = document.getElementById('f_flat')?.value.trim();
  const banner = document.getElementById('flatCheckBanner');
  if(!block || !flat){ if(banner) banner.innerHTML=''; return; }
  const myToken = ++_flatCheckToken;
  try{
    const [res] = await tursoBatch([stmt(
      `SELECT * FROM parking_requests WHERE block=? AND flat_number=? AND status != 'rejected' ORDER BY created_at DESC LIMIT 1`,
      [block, flat]
    )]);
    if(myToken !== _flatCheckToken) return; // a newer check superseded this one
    const rows = rowsToObjects(res).map(r=>({ ...r, vehicles: safeParseJSON(r.vehicles_json), documents: safeParseJSON(r.documents_json) }));
    if(rows.length === 0){ editingRequestId = null; if(banner) banner.innerHTML=''; return; }
    const existing = rows[0];
    if(existing.status === 'confirmed'){
      editingRequestId = null;
      banner.innerHTML = `<div class="config-banner" style="background:var(--bad-bg); color:var(--bad); border-color:transparent;">
        🔒 Block ${block}-${flat} already has a <b>confirmed &amp; sealed</b> parking allotment (Ref: ${existing.reference_number}, Slot ${existing.allotted_slot||'—'}). A new request can't be submitted for this flat — please contact the Admin office if changes are needed.</div>`;
      document.getElementById('submitBtn').disabled = true;
    } else {
      editingRequestId = existing.id;
      document.getElementById('submitBtn').disabled = false;
      banner.innerHTML = `<div class="config-banner">
        ✏️ Block ${block}-${flat} already has a request in progress (Ref: <b>${existing.reference_number}</b>, Status: ${(existing.status||'pending').replace('_',' ')}). Editing it below instead of creating a duplicate — your changes will update this same request. <a href="#" style="color:inherit; text-decoration:underline;" onclick="event.preventDefault(); editingRequestId=null; document.getElementById('flatCheckBanner').innerHTML=''; loadIntoForm({name:'',contact_number:'',notes:''}); draftVehicles=[{id:genId(),make:'',reg:'',relation:'owned',notes:''}]; draftDocs=[]; syncVehicleBlocks(); renderDocChips();">Start fresh instead</a></div>`;
      loadIntoForm(existing);
      draftVehicles = existing.vehicles && existing.vehicles.length ? existing.vehicles : [{id:genId(), make:'', reg:'', relation:'owned', notes:''}];
      draftDocs = existing.documents || [];
      document.getElementById('f_numveh').value = draftVehicles.length;
      syncVehicleBlocks();
      renderDocChips();
      document.getElementById('submitBtn').textContent = 'Update Request';
    }
  }catch(e){ /* non-fatal — form still usable for a fresh submission */ }
}
function loadIntoForm(r){
  if(document.getElementById('f_name')) document.getElementById('f_name').value = r.name || '';
  if(document.getElementById('f_contact')) document.getElementById('f_contact').value = r.contact_number || '';
  if(document.getElementById('f_notes')) document.getElementById('f_notes').value = r.notes || '';
  if(r.requestee_type === 'tenant' && document.getElementById('f_reqtype_tenant')) document.getElementById('f_reqtype_tenant').checked = true;
  else if(document.getElementById('f_reqtype_owner')) document.getElementById('f_reqtype_owner').checked = true;
}

  const n = Number(document.getElementById('f_numveh').value || 1);

async function submitRequest(){
  const name = document.getElementById('f_name').value.trim();
  const block = document.getElementById('f_block').value;
  const flat = document.getElementById('f_flat').value.trim();
  const contact = document.getElementById('f_contact').value.trim();
  const notes = document.getElementById('f_notes').value.trim();
  const requesteeType = document.querySelector('input[name="f_reqtype"]:checked')?.value || 'owner';
  if(!name||!block||!flat||!contact){ return toast('Please fill all required member details', false); }
  if(!/^\d{10}$/.test(contact)){ return toast('Enter a valid 10-digit contact number', false); }
  for(const v of draftVehicles){
    if(!v.make || !v.reg){ return toast('Fill in make and registration number for every vehicle', false); }
  }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.innerHTML = `<span class="loader"></span> ${editingRequestId ? 'Updating…' : 'Submitting…'}`;
  try{
    if(editingRequestId){
      // defensive re-check: make sure it hasn't been approved/rejected since the form loaded
      const [chk] = await tursoBatch([stmt(`SELECT status, reference_number FROM parking_requests WHERE id=?`,[editingRequestId])]);
      const chkRows = rowsToObjects(chk);
      if(chkRows.length===0){ toast('That request no longer exists — please refresh', false); btn.disabled=false; btn.innerHTML='Submit Request'; return; }
      if(chkRows[0].status === 'confirmed'){ toast('This request was just confirmed and can no longer be edited', false); btn.disabled=false; btn.innerHTML='Submit Request'; return renderRequestForm(); }
      await tursoBatch([stmt(
        `UPDATE parking_requests SET name=?, contact_number=?, requestee_type=?, num_vehicles=?, vehicles_json=?, documents_json=?, notes=?, updated_at=? WHERE id=?`,
        [name,contact,requesteeType,draftVehicles.length,JSON.stringify(draftVehicles),JSON.stringify(draftDocs),notes,nowISO(),editingRequestId]
      )]);
      showAckModal(chkRows[0].reference_number, name, true);
    } else {
      // defensive re-check in case another request landed for this flat between blur-check and submit
      const [dupChk] = await tursoBatch([stmt(`SELECT reference_number FROM parking_requests WHERE block=? AND flat_number=? AND status != 'rejected' LIMIT 1`,[block,flat])]);
      const dupRows = rowsToObjects(dupChk);
      if(dupRows.length > 0){ toast(`Block ${block}-${flat} already has a request in progress (Ref: ${dupRows[0].reference_number}) — reloading to edit it instead`, false); btn.disabled=false; btn.innerHTML='Submit Request'; setTab('request'); return; }
      const ref = await nextReferenceNumber();
      const ts = nowISO();
      await tursoBatch([stmt(
        `INSERT INTO parking_requests (reference_number,name,block,flat_number,contact_number,requestee_type,num_vehicles,vehicles_json,documents_json,notes,status,created_at,updated_at)
         VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        [ref,name,block,flat,contact,requesteeType,draftVehicles.length,JSON.stringify(draftVehicles),JSON.stringify(draftDocs),notes,'pending',ts,ts]
      )]);
      showAckModal(ref, name, false);
    }
    editingRequestId = null;
    draftVehicles = [{id:genId(), make:'', reg:'', relation:'owned', notes:''}];
    draftDocs = [];

  btn.disabled = false; btn.innerHTML = 'Submit Request';
}

async function doTrack(){
  const raw = document.getElementById('track_input').value.trim();
  if(!raw) return toast('Enter a reference number, contact number, name, or flat number', false);
  if(raw.length < 2) return toast('Enter at least 2 characters to search', false);
  try{
    const q = `%${raw}%`;
    const [res] = await tursoBatch([stmt(
      `SELECT * FROM parking_requests WHERE reference_number LIKE ? OR contact_number LIKE ? OR name LIKE ? OR flat_number LIKE ? ORDER BY created_at DESC LIMIT 25`,
      [q,q,q,q]
    )]);
    const rows = rowsToObjects(res).map(r=>({ ...r, vehicles: safeParseJSON(r.vehicles_json), documents: safeParseJSON(r.documents_json) }));
    // keep these available for the certificate view without needing a full admin loadRequests()
    rows.forEach(r=>{ const idx = allRequests.findIndex(x=>x.id===r.id); if(idx>=0) allRequests[idx]=r; else allRequests.push(r); });

    if(rows.length===0){ el.innerHTML = `<div class="empty-state"><div class="ic">🔍</div>No request found matching "${raw}"</div>`; return; }

/* ---------- SLOT INVENTORY ---------- */
// Series A-H, numbered 1-6 each (48). Two extra general slots added to reach 50.
// Edit SLOT_SERIES / EXTRA_SLOTS below if your association's actual layout differs.
const SLOT_SERIES = [
  {series:'A', count:6}, {series:'B', count:6}, {series:'C', count:6}, {series:'D', count:6},
  {series:'E', count:6}, {series:'F', count:6}, {series:'G', count:6}, {series:'H', count:6},
];
const EXTRA_SLOTS = ['G-EXT-1','G-EXT-2']; // top up to 50 — rename/remove as needed
function allSlotIds(){
  const ids = [];
  SLOT_SERIES.forEach(s=>{ for(let i=1;i<=s.count;i++){ ids.push(`${s.series}-${i}`); } });
  return [...ids, ...EXTRA_SLOTS];
}
function occupiedSlotMap(){
  // slot -> request using it (any request that has progressed to allotted/confirmed occupies its slot)
  const map = {};
  allRequests.filter(r=>['allotted','confirmed'].includes(r.status) && r.allotted_slot).forEach(r=>{
    map[r.allotted_slot] = r;
  });
  return map;
}
function openResetSlotsModal(){
  const allottedOnly = allRequests.filter(r=>r.status==='allotted');
  const confirmedToo = allRequests.filter(r=>r.status==='confirmed');
  document.getElementById('genModalBody').innerHTML = `
    <h2 style="color:var(--bad);">⚠ Reset All Slot Allotments</h2>
    <div class="sub">This clears the slot assignment on multiple requests at once so every slot shows free again and can be re-assigned.</div>
    <div class="card" style="padding:14px; margin:14px 0; background:var(--bad-bg);">
      <div class="req-sub" style="color:var(--bad); font-weight:600;">This does NOT delete any request, vehicle, or document — only the slot number (and, if selected below, the President's seal) is cleared. Approval history from Secretary and Legal & Law is kept.</div>
    </div>
    <div class="field">
      <label style="display:flex; align-items:center; gap:8px; font-weight:500; color:var(--text); cursor:pointer;">
        <input type="checkbox" id="reset_include_allotted" checked style="width:auto;"> Clear ${allottedOnly.length} slot(s) awaiting President's seal <span class="req-sub">(sends them back to "Ready to Allot")</span>
      </label>
    </div>
    <div class="field">
      <label style="display:flex; align-items:center; gap:8px; font-weight:500; color:var(--bad); cursor:pointer;">
        <input type="checkbox" id="reset_include_confirmed" style="width:auto;"> Also clear ${confirmedToo.length} already <b>confirmed &amp; sealed</b> allotment(s) <span class="req-sub">(invalidates their printed certificates)</span>
      </label>
    </div>
    <div class="field"><label>Reason for reset (required, for the access log) *</label><textarea id="reset_reason" placeholder="e.g. Annual re-allotment for 2027, or correcting a bulk assignment error"></textarea></div>
    <div class="field"><label>Type <b>RESET</b> to confirm *</label><input id="reset_confirm_text" placeholder="Type RESET"></div>
    <button class="btn btn-danger" style="width:100%; justify-content:center;" onclick="confirmResetSlots()">Clear Selected Slot Allotments</button>`;
  openModal('genModalBg');
}
async function confirmResetSlots(){
  const includeAllotted = document.getElementById('reset_include_allotted').checked;
  const includeConfirmed = document.getElementById('reset_include_confirmed').checked;
  const reason = document.getElementById('reset_reason').value.trim();
  const confirmText = document.getElementById('reset_confirm_text').value.trim();
  if(!includeAllotted && !includeConfirmed){ return toast('Select at least one group to clear', false); }
  if(!reason){ return toast('Enter a reason for the access log', false); }
  if(confirmText !== 'RESET'){ return toast('Type RESET exactly to confirm this bulk action', false); }
  try{
    const statuses = [];
    if(includeAllotted) statuses.push('allotted');
    if(includeConfirmed) statuses.push('confirmed');
    const placeholders = statuses.map(()=>'?').join(',');
    const [res] = await tursoBatch([stmt(`SELECT id FROM parking_requests WHERE status IN (${placeholders})`, statuses)]);
    const affectedIds = rowsToObjects(res).map(r=>r.id);
    if(affectedIds.length===0){ toast('Nothing matched — no slots were cleared', false); closeModal('genModalBg'); return; }
    await tursoBatch([stmt(
      `UPDATE parking_requests SET allotted_slot=NULL, allotted_by=NULL, allotted_at=NULL,
        president_approved_by=NULL, president_approved_at=NULL, president_remarks=NULL, seal_date=NULL, seal_valid_until=NULL,
        status='legal_approved', updated_at=? WHERE status IN (${placeholders})`,
      [nowISO(), ...statuses]
    )]);
    await logAccess(session.username, 'bulk_reset_slots', `count=${affectedIds.length} groups=${statuses.join('+')} reason="${reason}"`);
    closeModal('genModalBg');
    toast(`${affectedIds.length} request(s) reset — slots are free and back in the "Ready to Allot" queue`);
    renderAdminQueue();
  }catch(e){ toast(e.message, false); }
}
function openAllotModal(id){
  const r = allRequests.find(x=>x.id===id);
  const occupied = occupiedSlotMap();
  const allSlots = allSlotIds();
  const free = allSlots.filter(s=>!occupied[s]).length;
  const bySeries = SLOT_SERIES.map(s=>s.series).concat(['G-EXT']);
  document.getElementById('genModalBody').innerHTML = `
    <h2>Allot Parking Slot</h2>
    <div class="sub">${r.name} · Block ${r.block}-${r.flat_number} · ${r.reference_number}</div>
    <div style="font-size:12.5px; color:var(--text-dim); margin:6px 0 14px;">${free} of ${allSlots.length} slots free</div>
    <div id="slotPicker" style="max-height:340px; overflow-y:auto; padding-right:4px;"></div>
    <div class="field" style="margin-top:14px;"><label>Selected Slot</label><input id="am_slot" readonly placeholder="Click a slot above"></div>
    <button class="btn btn-primary" style="width:100%; justify-content:center;" id="am_confirm_btn" disabled onclick="confirmAllot(${id})">Allot & Send to President</button>`;
  const picker = document.getElementById('slotPicker');
  picker.innerHTML = SLOT_SERIES.map(s=>{
    const cells = [];
    for(let i=1;i<=s.count;i++){
      const slotId = `${s.series}-${i}`;
      const occ = occupied[slotId];
      cells.push(`<button type="button" class="btn btn-sm ${occ?'btn-danger':'btn-ghost'}" style="min-width:52px; ${occ?'cursor:not-allowed; opacity:.55;':''}" ${occ?`disabled title="Occupied by ${occ.name} (${occ.reference_number})"`:`onclick="selectSlot('${slotId}')"`} id="slotbtn_${slotId}">${slotId}</button>`);
    }
    return `<div style="margin-bottom:12px;"><div style="font-size:11px; font-weight:700; color:var(--text-dim); margin-bottom:6px;">Series ${s.series}</div><div style="display:flex; gap:6px; flex-wrap:wrap;">${cells.join('')}</div></div>`;
  }).join('') + (EXTRA_SLOTS.length ? `<div><div style="font-size:11px; font-weight:700; color:var(--text-dim); margin-bottom:6px;">General</div><div style="display:flex; gap:6px; flex-wrap:wrap;">${EXTRA_SLOTS.map(slotId=>{
    const occ = occupied[slotId];
    return `<button type="button" class="btn btn-sm ${occ?'btn-danger':'btn-ghost'}" style="min-width:70px; ${occ?'cursor:not-allowed; opacity:.55;':''}" ${occ?`disabled title="Occupied by ${occ.name} (${occ.reference_number})"`:`onclick="selectSlot('${slotId}')"`} id="slotbtn_${slotId}">${slotId}</button>`;
  }).join('')}</div></div>` : '');
  openModal('genModalBg');
}
function selectSlot(slotId){
  document.querySelectorAll('#slotPicker .btn-primary').forEach(b=>b.classList.replace('btn-primary','btn-ghost'));
  const btn = document.getElementById(`slotbtn_${slotId}`);
  if(btn){ btn.classList.remove('btn-ghost'); btn.classList.add('btn-primary'); }
  document.getElementById('am_slot').value = slotId;
  document.getElementById('am_confirm_btn').disabled = false;
}
async function confirmAllot(id){
  const slot = document.getElementById('am_slot').value.trim();
  if(!slot) return toast('Select a slot from the picker', false);
  try{
    // re-check occupancy right before writing, in case another admin allotted it moments ago
    await loadRequests();
    const clash = allRequests.find(r=>r.id!==id && ['allotted','confirmed'].includes(r.status) && r.allotted_slot===slot);
    if(clash){ toast(`Slot ${slot} was just taken by ${clash.name} (${clash.reference_number}) — pick another`, false); return openAllotModal(id); }
    await tursoBatch([stmt(
      `UPDATE parking_requests SET allotted_slot=?, allotted_by=?, allotted_at=?, status='allotted', updated_at=? WHERE id=?`,
      [slot, session.full_name, nowISO(), nowISO(), id]
    )]);
    await logAccess(session.username, 'allot_slot', `req=${id} slot=${slot}`);
    closeModal('genModalBg'); toast(`Slot ${slot} allotted — sent for President seal`); renderAdminQueue();
  }catch(e){ toast(e.message, false); }
}

async function approveStage(id, stage){
  const r = allRequests.find(x=>x.id===id);
  const nextStatus = stage==='secretary' ? 'secretary_approved' : 'legal_approved';
  const byField = stage==='secretary' ? 'secretary_approved_by' : 'legal_approved_by';
  const atField = stage==='secretary' ? 'secretary_approved_at' : 'legal_approved_at';
  try{
    await tursoBatch([stmt(
      `UPDATE parking_requests SET status=?, ${byField}=?, ${atField}=?, updated_at=? WHERE id=?`,
      [nextStatus, session.full_name, nowISO(), nowISO(), id]
    )]);
    await logAccess(session.username, `${stage}_approve`, `req=${id}`);

/* ---------- RENEWAL ---------- */
async function renderRenewalQueue(){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="section-title">Renewal</div><div class="section-desc">Loading…</div>`;
  await loadRequests();
  await loadSettings();
  const dueList = allRequests.filter(r=>r.status==='confirmed' && !r.renewal_pending).sort((a,b)=> new Date(a.seal_valid_until) - new Date(b.seal_valid_until));
  const pendingConfirm = allRequests.filter(r=>!!r.renewal_pending).sort((a,b)=> new Date(a.renewal_proposed_at) - new Date(b.renewal_proposed_at));
  const isAdmin = session && (session.role==='admin'||session.role==='superadmin');
  const isPresident = session && session.role==='president';
  const now = new Date();
  function dueBadge(r){
    if(!r.seal_valid_until) return `<span class="badge badge-pending">No expiry set</span>`;
    const until = new Date(r.seal_valid_until);
    const days = Math.ceil((until-now)/86400000);
    if(days<0) return `<span class="badge badge-rejected">Overdue ${Math.abs(days)}d</span>`;
    if(days<=30) return `<span class="badge badge-secretary">Due in ${days}d</span>`;
    return `<span class="badge badge-confirmed">Valid ${days}d</span>`;
  }
  app.innerHTML = `
    <div class="section-title">Renewal</div>
    <div class="section-desc">All confirmed allotments, ordered by renewal due date (soonest first). Admin proposes a renewal period, President confirms it, and a renewal certificate is generated automatically.</div>
    ${isAdmin ? renderValiditySettingsCard() : ''}
    <div class="section-title" style="margin-top:${isAdmin?30:10}px; font-size:16px;">Awaiting President's Renewal Confirmation (${pendingConfirm.length})</div>
    <div class="list" id="renewalPendingList" style="margin-bottom:30px;"></div>
    <div class="section-title" style="font-size:16px;">All Confirmed Allotments (${dueList.length})</div>
    <div class="list" id="renewalDueList"></div>`;

  document.getElementById('renewalPendingList').innerHTML = pendingConfirm.length===0 ?
    `<div class="empty-state" style="padding:24px;"><div class="ic">🕊️</div>Nothing awaiting renewal confirmation.</div>` :
    pendingConfirm.map(r=>`
    <div class="req-row" style="grid-template-columns:1.6fr auto;">
      <div>
        <div class="req-name">${r.name} <span class="ref-mono" style="margin-left:6px;">${r.reference_number}</span> <span class="badge badge-secretary" style="margin-left:6px;">Renewal #${(r.renewal_count||0)+1}</span></div>
        <div class="req-sub">Block ${r.block}-${r.flat_number} · Slot ${r.allotted_slot} · Proposed by ${r.renewal_proposed_by} on ${fmtDate(r.renewal_proposed_at)}</div>
        <div class="req-sub">Requested period: <b>${r.renewal_period_value} ${r.renewal_period_unit}</b> · Current expiry: ${fmtDate(r.seal_valid_until)}${r.renewal_notes ? ` · Notes: ${r.renewal_notes}` : ''}</div>
      </div>
      <div class="row-actions">
        <button class="btn btn-ghost btn-sm" onclick="openRequestDetail(${r.id})">Details</button>
        ${isAdmin ? `<button class="btn btn-danger btn-sm" onclick="cancelRenewalProposal(${r.id})">Cancel</button>` : ''}
        ${isPresident ? `<button class="btn btn-seal btn-sm" onclick="openRenewalConfirmModal(${r.id})">Confirm Renewal</button>` : (!isAdmin ? `<span class="badge badge-allotted">Awaiting President</span>` : '')}
      </div>
    </div>`).join('');

  document.getElementById('renewalDueList').innerHTML = dueList.length===0 ?
    `<div class="empty-state"><div class="ic">🅿</div>No confirmed allotments yet.</div>` :
    dueList.map(r=>`
    <div class="req-row" style="grid-template-columns:1.6fr auto auto;">
      <div>
        <div class="req-name">${r.name} <span class="ref-mono" style="margin-left:6px;">${r.reference_number}</span></div>
        <div class="req-sub">Block ${r.block}-${r.flat_number} · Slot ${r.allotted_slot} · ${r.renewal_count ? `Renewed ${r.renewal_count}×` : 'Original allotment'} · Expires ${fmtDate(r.seal_valid_until)}</div>
      </div>
      <div>${dueBadge(r)}</div>
      <div class="row-actions">
        <button class="btn btn-ghost btn-sm" onclick="openRequestDetail(${r.id})">Details</button>
        ${isAdmin ? `<button class="btn btn-primary btn-sm" onclick="openRenewalProposeModal(${r.id})">Propose Renewal</button>` : ''}
      </div>
    </div>`).join('');
}

    <div class="sub">Applied automatically to the President's initial seal and pre-filled for renewal proposals. Currently: <b>${settingsCache.validity_value} ${settingsCache.validity_unit}</b>.</div>

async function saveValiditySettings(){
  const val = Number(document.getElementById('set_validity_value').value);
  const unit = document.getElementById('set_validity_unit').value;
  if(!val || val < 1) return toast('Enter a valid number greater than 0', false);
  try{
    await saveSetting('validity_value', val);
    await saveSetting('validity_unit', unit);
    settingsCache.validity_value = val; settingsCache.validity_unit = unit;
    await logAccess(session.username, 'update_validity_settings', `value=${val} unit=${unit}`);
    toast('Default validity period updated');
    renderRenewalQueue();
  }catch(e){ toast(e.message, false); }

async function confirmRenewal(id){
  const r = allRequests.find(x=>x.id===id);
  const remarks = document.getElementById('ren_confirm_remarks').value.trim();

      renewal_no: (r.renewal_count||0) + 1,

    closeModal('genModalBg'); toast('Renewal confirmed — renewal certificate generated');

    renderRenewalQueue();

}

  document.getElementById('genModalBody').innerHTML = `
    <h2>Parking Certificate</h2>
    <div class="sub">Generated on confirmation — ${r.reference_number}</div>
    <div style="margin:16px 0;">${certificateHTML(r)}</div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-primary" style="flex:1; justify-content:center;" onclick="printCertificate(${r.id})">🖨️ Print / Save as PDF</button>
      <button class="btn btn-ghost" onclick="closeModal('genModalBg')">Close</button>
    </div>`;
  openModal('genModalBg');
}
function printCertificate(id){
  const r = allRequests.find(x=>x.id===id);
  if(!r){ toast('Reload the page and try again', false); return; }
  document.getElementById('certificatePrintArea').innerHTML = certificateHTML(r);
  window.print();
}

/* ---------- 17. REQUEST DETAIL MODAL (shared) ---------- */
function openRequestDetail(id){
  const r = allRequests.find(x=>x.id===id);
  if(!r) return;
  document.getElementById('genModalBody').innerHTML = `
    <h2>${r.name} <span class="ref-mono">${r.reference_number}</span></h2>
    <div class="sub">Block ${r.block}-${r.flat_number} · ${r.contact_number} · Submitted ${fmtDateTime(r.created_at)}</div>
    <div class="divider"></div>
    <h3 style="font-size:13.5px;">Vehicles</h3>
    ${r.vehicles.map(v=>`<div class="req-sub" style="margin:6px 0;">• ${v.make} — ${v.reg} — <b>${v.relation}</b>${v.notes ? ' — '+v.notes : ''}</div>`).join('')}
    ${r.notes ? `<div class="divider"></div><h3 style="font-size:13.5px;">Notes</h3><div class="sub">${r.notes}</div>` : ''}
    <div class="divider"></div>
    <button class="btn btn-ghost btn-sm" onclick="viewDocsModal(${JSON.stringify(r.documents_json||'[]').replace(/"/g,'&quot;')})">View Documents (${r.documents.length})</button>
  `;
  openModal('genModalBg');
}

/* ---------- 18. ACCESS LOG + STAFF ACCOUNT MANAGEMENT ---------- */
let staffUsersCache = [];
async function renderAccessLog(){
  const app = document.getElementById('app');
  const isAdmin = session && (session.role==='admin'||session.role==='superadmin');
  app.innerHTML = `<div class="section-title">Access Log</div><div class="section-desc">Loading…</div>`;
  const [logRes, userRes] = await tursoBatch([
    stmt(`SELECT * FROM parking_access_log ORDER BY timestamp DESC LIMIT 100`),
    stmt(`SELECT * FROM parking_users ORDER BY role`)
  ]);
  const rows = rowsToObjects(logRes);
  const users = rowsToObjects(userRes);
  staffUsersCache = users;
  app.innerHTML = `
    <div class="section-title" style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
      <span>Staff Users</span>
      ${isAdmin ? `<button class="btn btn-primary btn-sm" onclick="openCreateStaffModal()">+ Add Staff Account</button>` : ''}
    </div>
    <div class="section-desc">Every staff account, with when it was created and when they last logged in.</div>
    <div class="list" id="staffUsersList" style="margin-bottom:34px;"></div>
    <div class="section-title" style="font-size:18px;">Access Log</div>
    <div class="section-desc">Most recent 100 staff actions.</div>
    <div class="list">
      ${rows.length===0 ? `<div class="empty-state"><div class="ic">🗒️</div>No activity yet.</div>` :
      rows.map(l=>`
        <div class="req-row" style="grid-template-columns:1fr 1fr 1fr;">
          <div><b>${l.username}</b></div>
          <div class="req-sub">${l.action} ${l.details?('· '+l.details):''}</div>
          <div class="req-sub" style="text-align:right;">${fmtDateTime(l.timestamp)}</div>
        </div>`).join('')}
    </div>`;
  renderStaffUsersList();
}
function renderStaffUsersList(){
  const isAdmin = session && (session.role==='admin'||session.role==='superadmin');
  const users = staffUsersCache;
  document.getElementById('staffUsersList').innerHTML = users.length===0 ? `<div class="empty-state" style="padding:24px;"><div class="ic">👤</div>No staff accounts yet.</div>` :
    users.map(u=>{
      const active = Number(u.is_active) !== 0;
      return `
      <div class="req-row" style="grid-template-columns:1.3fr 0.9fr 1fr 1fr${isAdmin?' 1.5fr':''};">
        <div><b>${u.full_name}</b><div class="req-sub">@${u.username}</div></div>
        <div>
          <span class="badge badge-allotted">${ROLE_LABELS[u.role]||u.role}</span>
          ${active ? '' : `<span class="badge badge-rejected" style="margin-left:4px;">Disabled</span>`}
        </div>
        <div class="req-sub">Created<br><b style="color:var(--text);">${fmtDateTime(u.created_at)}</b></div>
        <div class="req-sub" style="text-align:right;">Last Login<br><b style="color:${u.last_login_at?'var(--good)':'var(--text-faint)'};">${u.last_login_at ? fmtDateTime(u.last_login_at) : 'Never logged in'}</b></div>
        ${isAdmin ? `
        <div style="display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; align-items:flex-start;">
          <button class="btn btn-ghost btn-sm" onclick="openEditStaffModal(${u.id})">Edit</button>
          <button class="btn ${active?'btn-danger':'btn-ghost'} btn-sm" onclick="toggleStaffActive(${u.id})">${active?'Disable':'Enable'}</button>
          <button class="btn btn-danger btn-sm" onclick="deleteStaffAccount(${u.id})">Delete</button>
        </div>` : ''}
      </div>`;
    }).join('');
}
const STAFF_ROLE_OPTIONS = [['admin','Admin'],['secretary','Secretary'],['legal','Legal & Law'],['president','President'],['superadmin','Super Admin']];
function openCreateStaffModal(){
  document.getElementById('genModalBody').innerHTML = `
    <h2>Add Staff Account</h2>
    <div class="sub">Create a new staff login with a role.</div>
    <div class="field"><label>Full name</label><input id="cs_name" placeholder="Full name"></div>
    <div class="field"><label>Username</label><input id="cs_user" placeholder="Username"></div>
    <div class="field"><label>Password</label><input id="cs_pass" type="password" placeholder="Set a password"></div>
    <div class="field"><label>Role</label>
      <select id="cs_role">${STAFF_ROLE_OPTIONS.map(([id,label])=>`<option value="${id}">${label}</option>`).join('')}</select>
    </div>
    <button class="btn btn-primary" style="width:100%; justify-content:center; margin-top:6px;" onclick="submitCreateStaff()">Create account</button>`;
  openModal('genModalBg');
}
async function submitCreateStaff(){
  const name = document.getElementById('cs_name').value.trim();
  const user = document.getElementById('cs_user').value.trim();
  const pass = document.getElementById('cs_pass').value;
  const role = document.getElementById('cs_role').value;
  if(!name||!user||!pass||!role){ return toast('Fill in all fields', false); }
  try{
    const [existing] = await tursoBatch([stmt(`SELECT id FROM parking_users WHERE username=?`,[user])]);
    if(rowsToObjects(existing).length>0){ return toast('That username is already taken', false); }
    const hash = await sha256(pass);
    await tursoBatch([stmt(`INSERT INTO parking_users (username,password_hash,role,full_name,created_at,is_active) VALUES (?,?,?,?,?,1)`,
      [user,hash,role,name,nowISO()])]);
    await logAccess(session.username, 'create_staff', `username=${user} role=${role}`);
    closeModal('genModalBg'); toast('Staff account created');
    await renderAccessLog();
  }catch(e){ toast(e.message, false); }
}
function openEditStaffModal(id){
  const u = staffUsersCache.find(x=>x.id===id);
  if(!u) return;
  document.getElementById('genModalBody').innerHTML = `
    <h2>Edit Staff Account</h2>
    <div class="sub">Leave password blank to keep it unchanged.</div>
    <div class="field"><label>Full name</label><input id="es_name" value="${u.full_name}"></div>
    <div class="field"><label>Username</label><input id="es_user" value="${u.username}"></div>
    <div class="field"><label>New password</label><input id="es_pass" type="password" placeholder="Leave blank to keep current password"></div>
    <div class="field"><label>Role</label>
      <select id="es_role">${STAFF_ROLE_OPTIONS.map(([id2,label])=>`<option value="${id2}" ${u.role===id2?'selected':''}>${label}</option>`).join('')}</select>
    </div>
    <button class="btn btn-primary" style="width:100%; justify-content:center; margin-top:6px;" onclick="submitEditStaff(${u.id})">Save changes</button>`;
  openModal('genModalBg');
}
async function submitEditStaff(id){
  const u = staffUsersCache.find(x=>x.id===id);
  if(!u) return;
  const name = document.getElementById('es_name').value.trim();
  const user = document.getElementById('es_user').value.trim();
  const pass = document.getElementById('es_pass').value;
  const role = document.getElementById('es_role').value;
  if(!name||!user||!role){ return toast('Full name, username and role are required', false); }
  try{
    if(user !== u.username){
      const [existing] = await tursoBatch([stmt(`SELECT id FROM parking_users WHERE username=? AND id!=?`,[user, id])]);
      if(rowsToObjects(existing).length>0){ return toast('That username is already taken', false); }
    }
    if(pass){
      const hash = await sha256(pass);
      await tursoBatch([stmt(`UPDATE parking_users SET full_name=?, username=?, role=?, password_hash=? WHERE id=?`,[name,user,role,hash,id])]);
    } else {
      await tursoBatch([stmt(`UPDATE parking_users SET full_name=?, username=?, role=? WHERE id=?`,[name,user,role,id])]);
    }
    await logAccess(session.username, 'edit_staff', `id=${id} username=${user} role=${role}${pass?' password_changed':''}`);
    if(session.username===u.username && user!==u.username){
      session.username = user; session.full_name = name; session.role = role;
      localStorage.setItem('pk_session', JSON.stringify(session));
      renderSessionBadge();
    } else if(session.username===u.username){
      session.full_name = name; session.role = role;
      localStorage.setItem('pk_session', JSON.stringify(session));
      renderSessionBadge();
    }
    closeModal('genModalBg'); toast('Staff account updated');
    await renderAccessLog();
  }catch(e){ toast(e.message, false); }
}
async function toggleStaffActive(id){
  const u = staffUsersCache.find(x=>x.id===id);
  if(!u) return;
  const active = Number(u.is_active) !== 0;
  if(active && session.username===u.username){ return toast("You can't disable your own account while logged in", false); }
  if(active && !confirm(`Disable staff account "${u.username}"? They will no longer be able to log in.`)) return;
  try{
    await tursoBatch([stmt(`UPDATE parking_users SET is_active=? WHERE id=?`,[active?0:1, id])]);
    await logAccess(session.username, active?'disable_staff':'enable_staff', `id=${id} username=${u.username}`);
    toast(active?'Account disabled':'Account enabled');
    await renderAccessLog();
  }catch(e){ toast(e.message, false); }
}
async function deleteStaffAccount(id){
  const u = staffUsersCache.find(x=>x.id===id);
  if(!u) return;
  if(session.username===u.username){ return toast("You can't delete your own account while logged in", false); }
  if(!confirm(`Permanently delete staff account "${u.username}"? This cannot be undone.`)) return;
  try{
    await tursoBatch([stmt(`DELETE FROM parking_users WHERE id=?`,[id])]);
    await logAccess(session.username, 'delete_staff', `id=${id} username=${u.username}`);
    toast('Staff account deleted');
    await renderAccessLog();
  }catch(e){ toast(e.message, false); }
}

/* ---------- 19. INIT ---------- */
function applyLogos(){
  document.querySelectorAll('[data-logo-src]').forEach(el=>{ el.src = BDA_LOGO_DATA_URI; });
}
(async function init(){
  renderTabs(); renderSessionBadge();
  applyLogos();
  if(CONFIGURED){
    try{ await initSchema(); }catch(e){ console.error(e); }
    try{ await loadSettings(); }catch(e){ console.error(e); }
  }
  render();
})();
</script>
